name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify tag matches package version
        run: >-
          node -e "const p=require('./package.json');
          if (process.env.RELEASE_TAG !== 'v'+p.version) {
            throw new Error('tag '+process.env.RELEASE_TAG+' does not match package '+p.version)
          }"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
